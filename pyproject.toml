[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboadvisor-tfm"
version = "0.1.0"
description = "Personalised roboadvisor — TFM (M1 NLP profiling, M2 ETF universe, M3 portfolio optimization)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Juan Trillo" }]

dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.4",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "yfinance==1.3.0",
    "pyarrow==23.0.0",
    "transformers==4.57.6",
    "torch==2.11.0",
    "streamlit==1.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ipykernel==7.1.0",
    "nbconvert==7.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["roboadvisor_paths"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
